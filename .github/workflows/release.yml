# Third-party actions are pinned to a commit (the tag it was at is in the comment):
# a moved tag must not be able to change what runs here.
name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the beta only after both platforms pass
        type: boolean
        default: false
      allow_unnotarized:
        description: Explicitly allow a macOS beta with system security warnings
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm test:animations
      - run: pnpm build
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: universal-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    # The updater signing key is given only to the steps that need it (the
    # release check and the build that signs), never to the setup actions.
    env:
      MEWLINK_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      MEWLINK_ALLOW_UNNOTARIZED: ${{ inputs.allow_unnotarized || false }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - id: signing
        run: node scripts/check-release.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SELF_SIGNED_CERTIFICATE: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE }}
          MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # Tauri's own APPLE_CERTIFICATE import only accepts Apple-issued identity
      # names, so the self-signed identity is installed here and Tauri gets just
      # APPLE_SIGNING_IDENTITY. codesign only uses an identity that is trusted
      # for code signing; the runner is thrown away after the job and users'
      # Macs are never changed.
      - name: Install the MewLink self-signed signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.selfsigned == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/mewlink-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/mewlink-signing.p12"
          security import "$RUNNER_TEMP/mewlink-signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/mewlink-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain src-tauri/macos/mewlink-self-signed.pem
          security find-identity -v -p codesigning | grep -q "MewLink Self-Signed Code Signing"
          echo "MewLink self-signed identity is ready for codesign"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        if: steps.signing.outputs.notarize != 'true' && steps.signing.outputs.selfsigned != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false
      # Pin the trusted-app identity; self-signed cdhash partitions may still need upgrade authorization.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        if: steps.signing.outputs.selfsigned == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: MewLink Self-Signed Code Signing
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        if: steps.signing.outputs.notarize == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false
      - name: Check macOS universal binary and signature
        if: runner.os == 'macOS'
        run: |
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' src-tauri/target/universal-apple-darwin/release/bundle/macos/MewLink.app/Contents/Info.plist)
          lipo "src-tauri/target/universal-apple-darwin/release/bundle/macos/MewLink.app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          codesign --verify --deep --strict src-tauri/target/universal-apple-darwin/release/bundle/macos/MewLink.app
          if [ "${{ steps.signing.outputs.selfsigned }}" = "true" ]; then
            app=src-tauri/target/universal-apple-darwin/release/bundle/macos/MewLink.app
            details=$(codesign -dvv "$app" 2>&1)
            requirement=$(codesign -d -r- "$app" 2>&1)
            leaf=$(openssl x509 -in src-tauri/macos/mewlink-self-signed.pem -noout -fingerprint -sha1 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')
            echo "$details" | grep -E '^(Identifier|Authority|TeamIdentifier|Signature)' || true
            echo "$requirement"
            echo "Expected certificate SHA-1: $leaf"
            if ! grep -q 'Authority=MewLink Self-Signed Code Signing' <<< "$details"; then
              echo "::error::MewLink.app is not signed by the MewLink self-signed certificate"; exit 1
            fi
            # The designated requirement pins the certificate by its SHA-1 hash
            # (spelled "certificate leaf/root = H" or "anchor H" depending on macOS).
            if ! tr 'A-F' 'a-f' <<< "$requirement" | grep -q "$leaf"; then
              echo "::error::The designated requirement does not pin the MewLink certificate"; exit 1
            fi
            echo "Signed with the stable MewLink certificate (leaf $leaf)"
          fi
          if [ "${{ steps.signing.outputs.notarize }}" = "true" ]; then
            xcrun stapler validate src-tauri/target/universal-apple-darwin/release/bundle/macos/MewLink.app
            spctl --assess --type execute src-tauri/target/universal-apple-darwin/release/bundle/macos/MewLink.app
            echo "MEWLINK_NOTARIZED=true" >> "$GITHUB_ENV"
          fi
      - run: node scripts/collect-release.mjs ${{ matrix.platform }} ${{ matrix.target }}
        env:
          MEWLINK_SELF_SIGNED: ${{ steps.signing.outputs.selfsigned }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify signatures, source, versions and complete platform set
        run: node scripts/prepare-release.mjs release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-metadata
          path: |
            release-assets/latest.json
            release-assets/SHA256SUMS
          if-no-files-found: error
      - name: Publish both platforms together
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!require('./release-state.json').isDraft) throw Error('Refusing to replace a published version')"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "MewLink $tag" --notes "$(node -p "require('./release-assets/latest.json').notes")"
          fi
          gh release upload "$tag" release-assets/MewLink_* release-assets/latest.json release-assets/SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
